<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rummy Online 2 Jugadores</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 10px;
            background-color: #1e3d2f;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        h1 { margin: 5px 0; font-size: 1.4rem; }

        #panel-conexion {
            background: #14281f;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #3a6b52;
            width: 100%;
            max-width: 600px;
            margin-bottom: 10px;
            text-align: center;
        }

        input {
            padding: 8px;
            font-size: 1rem;
            border-radius: 4px;
            border: none;
            width: 140px;
            text-align: center;
        }

        #tablero {
            width: 100%;
            max-width: 600px;
            min-height: 220px;
            max-height: 300px;
            background-color: #14281f;
            border: 2px solid #3a6b52;
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 10px;
        }

        .grupo-jugada {
            display: inline-flex;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px;
            border-radius: 6px;
            gap: 4px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
        }

        #soporte {
            width: 100%;
            max-width: 600px;
            min-height: 110px;
            background-color: #3e2723;
            border: 3px solid #5d4037;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .ficha {
            width: 38px;
            height: 52px;
            background-color: #fff8e7;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 2px 2px 4px rgba(0,0,0,0.4);
            cursor: pointer;
            border: 2px solid #ccc;
        }

        .rojo { color: #d32f2f; }
        .azul { color: #1976d2; }
        .negro { color: #212121; }
        .amarillo { color: #fbc02d; }

        .ficha.seleccionada {
            border-color: #00e676;
            transform: translateY(-5px);
            box-shadow: 0 0 8px #00e676;
        }

        .controles {
            margin: 10px 0;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 8px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            background-color: #4caf50;
            color: white;
            cursor: pointer;
        }

        button:disabled { background-color: #555; cursor: not-allowed; }
        button.rob { background-color: #ff9800; }
        button.pasar { background-color: #2196F3; }
        button.reset { background-color: #e53935; }

        #mensaje { color: #ffeb3b; min-height: 20px; font-weight: bold; margin-bottom: 5px; text-align: center; }
        #turno-info { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }
        #estado-apertura { font-size: 0.85rem; color: #b2dfdb; margin-bottom: 5px; }
    </style>
</head>
<body>

    <h1>Rummy Online 2P</h1>

    <div id="panel-conexion">
        <div>Tu ID de Sala: <b id="mi-id">Generando...</b></div>
        <div style="margin-top: 8px;">
            <input type="text" id="id-destino" placeholder="ID del rival">
            <button onclick="conectarRival()">Unirse a Sala</button>
        </div>
    </div>

    <div id="turno-info">Esperando rival...</div>
    <div id="estado-apertura">Apertura inicial: Necesitas min. 30 puntos</div>
    <div id="mensaje"></div>

    <div id="tablero"></div>

    <div class="controles">
        <button id="btn-crear-grupo" onclick="crearNuevoGrupo()" disabled>Crear Grupo de Fichas</button>
        <button id="btn-robar" class="rob" onclick="robarFicha()" disabled>Robar y Pasar</button>
        <button id="btn-pasar" class="pasar" onclick="finalizarTurno()" disabled>Finalizar Turno</button>
        <button id="btn-reset" class="reset" onclick="deshacerMovimientos()" disabled>Deshacer Movimientos</button>
    </div>

    <div id="soporte"></div>

    <script>
        const colores = ['rojo', 'azul', 'negro', 'amarillo'];
        let mazo = [], mano = [], seleccionadas = [];
        let tableroGrupos = []; 
        let peer, conn;
        let esMiTurno = false;
        let soyHost = false;

        // Copias de respaldo para deshacer cambios si el movimiento es inválido
        let copiaTableroInicioTurno = [];
        let copiaManoInicioTurno = [];
        
        let haAbierto = false;      
        let haBajadoEnEsteTurno = false;

        function iniciarPeer() {
            const idCorto = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer(idCorto);

            peer.on('open', id => {
                document.getElementById('mi-id').textContent = id;
            });

            peer.on('connection', c => {
                conn = c;
                soyHost = true;
                esMiTurno = true;
                
                conn.on('open', () => {
                    configurarConexion();
                    iniciarPartidaHost();
                });
            });
        }

        function conectarRival() {
            const idRival = document.getElementById('id-destino').value;
            if (!idRival) return alert("Introduce el ID del rival");
            conn = peer.connect(idRival);
            soyHost = false;
            esMiTurno = false;

            conn.on('open', () => {
                configurarConexion();
            });
        }

        function configurarConexion() {
            document.getElementById('panel-conexion').style.display = 'none';
            document.getElementById('mensaje').textContent = "¡Conectado con éxito!";

            conn.on('data', data => {
                procesarDatos(data);
            });
        }

        function crearMazo() {
            mazo = [];
            for (let i = 0; i < 2; i++) {
                colores.forEach(color => {
                    for (let num = 1; num <= 13; num++) {
                        mazo.push({ numero: num, color: color, id: Math.random() });
                    }
                });
            }
            mazo.sort(() => Math.random() - 0.5);
        }

        function iniciarPartidaHost() {
            crearMazo();
            mano = mazo.splice(0, 14);
            const manoRival = mazo.splice(0, 14);

            guardarEstadoTurno();

            setTimeout(() => {
                renderizarMano();
                actualizarInterfazTurno();
            }, 100);

            conn.send({ 
                tipo: 'INICIO', 
                manoRival: manoRival 
            });
        }

        function procesarDatos(data) {
            if (data.tipo === 'INICIO') {
                mano = data.manoRival;
                seleccionadas = [];
                guardarEstadoTurno();
                setTimeout(() => {
                    renderizarMano();
                    actualizarInterfazTurno();
                }, 100);
            } else if (data.tipo === 'ACCION') {
                tableroGrupos = data.tablero;
                mazo = data.mazo;
                esMiTurno = true;
                haBajadoEnEsteTurno = false;
                
                if (data.victoriaRival) {
                    alert("¡EL RIVAL HA JUGADO SU ÚLTIMA FICHA Y HA GANADO!");
                    esMiTurno = false;
                }

                guardarEstadoTurno();
                document.getElementById('mensaje').textContent = "";
                renderizarTablero();
                renderizarMano();
                actualizarInterfazTurno();
            }
        }

        function guardarEstadoTurno() {
            copiaTableroInicioTurno = JSON.parse(JSON.stringify(tableroGrupos));
            copiaManoInicioTurno = JSON.parse(JSON.stringify(mano));
        }

        function deshacerMovimientos() {
            if (!esMiTurno) return;
            tableroGrupos = JSON.parse(JSON.stringify(copiaTableroInicioTurno));
            mano = JSON.parse(JSON.stringify(copiaManoInicioTurno));
            seleccionadas = [];
            haBajadoEnEsteTurno = false;
            document.getElementById('mensaje').textContent = "Movimientos deshechos.";
            renderizarTablero();
            renderizarMano();
            actualizarInterfazTurno();
        }

        function actualizarInterfazTurno() {
            const txt = document.getElementById('turno-info');
            const txtApertura = document.getElementById('estado-apertura');
            const btnCrear = document.getElementById('btn-crear-grupo');
            const btnRobar = document.getElementById('btn-robar');
            const btnPasar = document.getElementById('btn-pasar');
            const btnReset = document.getElementById('btn-reset');

            txtApertura.textContent = haAbierto 
                ? "Apertura inicial completada" 
                : "Apertura inicial: Necesitas min. 30 puntos";

            if (esMiTurno) {
                txt.textContent = "TU TURNO";
                txt.style.color = "#4caf50";
                
                btnCrear.disabled = false;
                btnRobar.disabled = haBajadoEnEsteTurno; 
                btnPasar.disabled = false;
                btnReset.disabled = false;
            } else {
                txt.textContent = "Turno del Rival...";
                txt.style.color = "#ff9800";
                btnCrear.disabled = true;
                btnRobar.disabled = true;
                btnPasar.disabled = true;
                btnReset.disabled = true;
            }
        }

        function seleccionarFicha(ficha) {
            if (!esMiTurno) return;
            const idx = seleccionadas.findIndex(f => f.id === ficha.id);
            if (idx > -1) {
                seleccionadas.splice(idx, 1);
            } else {
                seleccionadas.push(ficha);
            }
            renderizarMano();
            renderizarTablero();
        }

        function renderizarMano() {
            const soporte = document.getElementById('soporte');
            soporte.innerHTML = '';
            mano.sort((a, b) => a.numero - b.numero);
            
            mano.forEach(ficha => {
                const div = document.createElement('div');
                div.className = `ficha ${ficha.color}`;
                if (seleccionadas.some(f => f.id === ficha.id)) div.classList.add('seleccionada');
                div.textContent = ficha.numero;
                div.onclick = () => seleccionarFicha(ficha);
                soporte.appendChild(div);
            });
        }

        function renderizarTablero() {
            const tablero = document.getElementById('tablero');
            tablero.innerHTML = '';

            // Limpiar grupos vacíos si los hubiera
            tableroGrupos = tableroGrupos.filter(g => g.length > 0);

            tableroGrupos.forEach((grupo, gIdx) => {
                const contenedor = document.createElement('div');
                contenedor.className = 'grupo-jugada';

                grupo.forEach(ficha => {
                    const div = document.createElement('div');
                    div.className = `ficha ${ficha.color}`;
                    if (seleccionadas.some(f => f.id === ficha.id)) div.classList.add('seleccionada');
                    div.textContent = ficha.numero;
                    div.onclick = () => seleccionarFicha(ficha);
                    contenedor.appendChild(div);
                });

                tablero.appendChild(contenedor);
            });
        }

        function esGrupoValido(grupo) {
            if (grupo.length < 3) return false;
            const f = [...grupo].sort((a, b) => a.numero - b.numero);

            // Trío / Cuarteto
            const mismoNumero = f.every(item => item.numero === f[0].numero);
            const coloresUnicos = new Set(f.map(item => item.color)).size === f.length;
            if (mismoNumero && coloresUnicos) return true;

            // Escalera
            const mismoColor = f.every(item => item.color === f[0].color);
            let esConsecutivo = true;
            for (let i = 0; i < f.length - 1; i++) {
                if (f[i + 1].numero !== f[i].numero + 1) {
                    esConsecutivo = false;
                    break;
                }
            }
            return mismoColor && esConsecutivo;
        }

        function calcularPuntos(grupo) {
            return grupo.reduce((suma, ficha) => suma + ficha.numero, 0);
        }

        function crearNuevoGrupo() {
            if (!esMiTurno || seleccionadas.length === 0) return;

            const mensaje = document.getElementById('mensaje');

            // Separar las fichas seleccionadas de la mano y del tablero
            const fichasNuevas = [...seleccionadas];
            fichasNuevas.sort((a, b) => a.numero - b.numero);

            // Quitar de la mano
            mano = mano.filter(f => !seleccionadas.some(s => s.id === f.id));

            // Quitar de los grupos existentes del tablero
            tableroGrupos = tableroGrupos.map(g => g.filter(f => !seleccionadas.some(s => s.id === f.id)));

            // Añadir el nuevo grupo al tablero
            tableroGrupos.push(fichasNuevas);

            seleccionadas = [];
            haBajadoEnEsteTurno = true;
            mensaje.textContent = "Grupo creado o modificado en la mesa.";

            renderizarTablero();
            renderizarMano();
            actualizarInterfazTurno();
        }

        function finalizarTurno() {
            if (!esMiTurno) return;
            const mensaje = document.getElementById('mensaje');

            // 1. Limpiar grupos vacíos
            tableroGrupos = tableroGrupos.filter(g => g.length > 0);

            // 2. Comprobar que TODOS los grupos del tablero sean válidos
            const todosValidos = tableroGrupos.every(g => esGrupoValido(g));

            if (!todosValidos) {
                mensaje.textContent = "¡Movimiento inválido! Todos los grupos de la mesa deben tener al menos 3 fichas formando trío o escalera.";
                return;
            }

            // 3. Comprobar Apertura de 30 puntos si no ha abierto antes
            if (!haAbierto) {
                // Calcular puntos de fichas nuevas bajadas desde la mano
                const fichasEnMesa = tableroGrupos.flat();
                const fichasNuevasDesdeMano = fichasEnMesa.filter(f => !copiaManoInicioTurno.some(m => m.id === f.id));
                const puntosApertura = calcularPuntos(fichasNuevasDesdeMano);

                if (puntosApertura < 30 || fichasNuevasDesdeMano.length === 0) {
                    mensaje.textContent = `Para la apertura inicial debes bajar fichas de tu mano que sumen al menos 30 puntos (Suma actual: ${puntosApertura} pts).`;
                    return;
                } else {
                    haAbierto = true;
                }
            }

            // 4. Comprobar CONDICIÓN DE VICTORIA (se queda sin fichas)
            const victoria = mano.length === 0;

            if (victoria) {
                alert("¡ENHORABUENA, HAS GANADO LA PARTIDA!");
            }

            // 5. Enviar actualización al rival y pasar turno
            esMiTurno = false;
            haBajadoEnEsteTurno = false;
            seleccionadas = [];
            actualizarInterfazTurno();

            conn.send({
                tipo: 'ACCION',
                tablero: tableroGrupos,
                mazo: mazo,
                victoriaRival: victoria
            });
        }

        function robarFicha() {
            if (!esMiTurno || haBajadoEnEsteTurno) return;

            if (mazo.length > 0) {
                mano.push(mazo.pop());
                document.getElementById('mensaje').textContent = "Has robado una ficha.";
            } else {
                document.getElementById('mensaje').textContent = "No quedan fichas en el mazo.";
            }

            // Deshacer cualquier movimiento incompleto al robar
            deshacerMovimientos();

            // Pasar turno automáticamente
            esMiTurno = false;
            actualizarInterfazTurno();

            conn.send({
                tipo: 'ACCION',
                tablero: tableroGrupos,
                mazo: mazo,
                victoriaRival: false
            });
        }

        iniciarPeer();
    </script>
</body>
</html>
